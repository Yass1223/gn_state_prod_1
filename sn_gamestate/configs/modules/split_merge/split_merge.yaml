# Tracklet splitting + fragment merging on appearance, run as its own pipeline stage
# right after `track` and `crop_filter`; it writes the final track_id.
#
# Method (sn_gamestate/track/split_merge.py, ported from
# splitter-plus-merger-final.ipynb): per tracklet, DBSCAN on the cosine distances
# of its clean detections (the crop filter's `crop_single`) breaks a tracklet that
# holds more than one identity into fragments; per video, fragments are merged
# agglomeratively on appearance (1 - dot of mean unit vectors over clean rows) as
# long as their clean frame sets are disjoint and the distance is <= tau; then one
# detection per trajectory and frame is enforced (clean wins) and the set-aside and
# clean-less detections are placed into the nearest trajectory with a free slot. No
# spatial or motion constraint.
#
# Parameters are the notebook's final configuration: eps 0.2 / min_samples 5 (the
# single splitter setting the notebook runs end to end) and tau 0.60 (best pairwise
# F1 on the validation split in the notebook's threshold sweep; 0.55 was the
# precision-leaning alternative). They were tuned against embeddings held in the
# notebook's Kaggle export; whether those were produced by the checkpoint pinned
# below is not verifiable from this repository (see README).
#
# Appearance: the tracker's OSNet-AIN, built from the shared module
# sn_gamestate/reid/osnet_ain.py with the SAME checkpoint pin as
# modules/track/botsort_ain.yaml, fp16 autocast on CUDA with fp32 outputs. The run
# audit fails the run on any pin mismatch between the two configs.
_target_: sn_gamestate.track.split_merge_api.SplitMerge
cfg:
  # OSNet-AIN checkpoint — SAME coordinates and digest as modules/track/botsort_ain.yaml.
  ain_repo: Ynniss/osnet_ain
  ain_file: best_ain_full.zip
  ain_revision: d78f65ded828f0cbd8dff2a06dcbff4fc6835dfe
  ain_sha256: a0a7e42676edad0cbc3a4ba0f7d0f8ded75612443ef7a9eabb57cb9e5e245293
  # As in the track config: set this to read the checkpoint from disk instead of the
  # Hub. Keep it in step with the tracker's value, or the two stages embed the same
  # crop with two different models.
  ain_local_path: null
  eps: 0.2            # DBSCAN eps on cosine distance, per tracklet, clean detections only
  min_samples: 5      # DBSCAN min_samples; a tracklet with fewer clean detections is one fragment
  tau: 0.60           # merge stops when the closest admissible fragment pair is farther than this
  batch_size: 64      # crops per appearance forward pass
  # Per-sequence sidecar (settings, embedder digest, split/merge/pass counts,
  # per-trajectory breakdown) read by the `audit` stage.
  audit_dir: ${project_dir}/audit/split_merge
