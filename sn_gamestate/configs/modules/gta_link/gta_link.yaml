# GTA-Link offline tracklet stitching, run as its own pipeline stage right after `track`.
# Uses the same OSNet-AIN as the tracker, built from the shared module
# sn_gamestate/reid/osnet_ain.py. The GSR downstream (prtreid role/team, jersey) works
# on the final track ids this stage produces and is otherwise independent of it.
#
# Connect hyperparameters are the per-tracker tuned optima carried over from the
# BoT-SORT · SOF variant (appearance_thresh 0.25, spatial_thresh 150,
# min_tracklet_len 20, ema_alpha 0.9, linkage average). They were tuned against the
# previous sports-OSNet embedding, so they are a starting point rather than a settled
# optimum now that the appearance model has changed, and should be re-checked on Kaggle.
#
# Precision: reads the pipeline's `${precision}` flag, which MUST match the track
# module's — a crop must embed to the same vector in the tracking pass and here. The
# run audit fails the run on any checkpoint or precision mismatch between the two
# configs. There is no TensorRT path for the appearance model.
_target_: sn_gamestate.track.gta_link_api.GTALink
cfg:
  # OSNet-AIN checkpoint — SAME coordinates and digest as modules/track/botsort_ain.yaml.
  ain_repo: Ynniss/osnet_ain
  ain_file: best_ain_full.zip
  ain_revision: d78f65ded828f0cbd8dff2a06dcbff4fc6835dfe
  ain_sha256: a0a7e42676edad0cbc3a4ba0f7d0f8ded75612443ef7a9eabb57cb9e5e245293
  # As in the track config: set this to read the checkpoint from disk instead of the
  # Hub. Keep it in step with the tracker's value, or the two stages embed the same
  # crop with two different models.
  ain_local_path: null
  precision: ${precision}
  appearance_thresh: 0.25   # agglomerative merge cutoff on cosine distance
  spatial_thresh: 150       # px centre-gap gate, scaled by sqrt(frame gap)
  min_tracklet_len: 20      # tracklets shorter than this are not merged
  ema_alpha: 0.9            # appearance EMA over a tracklet's detections
  linkage: average          # agglomerative mode only
  batch_size: 64            # crops per appearance forward pass
  # Connect algorithm. `agglomerative` = one shot of AgglomerativeClustering on the
  # gated matrix (today's baseline). `iterative` = the sjc042/gta-link reference:
  # greedy global-minimum merge, per-pair gate, row/col recompute after each merge —
  # structurally free of the transitive per-frame collisions average linkage can
  # create. A/B on Kaggle.
  connect_mode: agglomerative

  # Split (reference GTA-Link is Split + Connect; this module had only Connect).
  # Tracklets of >= split_len_thres detections are DBSCAN-clustered on their
  # per-detection embeddings before Connect; >1 cluster means the tracker glued two
  # identities together, and the tracklet is broken up so Connect can re-stitch it.
  # ALL FOUR VALUES BELOW ARE UNTUNED starting points — the Kaggle sweep sets them
  # jointly with the Connect parameters.
  use_split: false
  split_eps: 0.6          # DBSCAN eps on cosine distance over standardised embeddings
  split_min_samples: 4    # DBSCAN min_samples
  split_max_k: 3          # cap on fragments per tracklet (closest centres merged)
  split_len_thres: 30     # only tracklets with >= this many detections are examined
