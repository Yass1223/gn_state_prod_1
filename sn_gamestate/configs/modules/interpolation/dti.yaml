# Linear interpolation of tracklet gaps (DTI), the offline step official BoT-SORT
# ships as tools/interpolation.py and GTA-Link (sjc042) does not have. Runs directly
# after `gta_link`, on final track ids.
#
# NOT in the production pipeline (soccernet.yaml `pipeline:`): synthesized rows
# carry no crop label (crop_filter runs before gta_link) and no team_embedding, so
# the role_team stage would meet rows without the columns it reads. The module is
# kept for scripts/tune_gta_kaggle.py, whose tracking-only states need only
# track_id / bbox_ltwh / image_id. enabled: false is a true no-op.
#
# n_dti / n_min are UNTUNED (the values below are the brief's starting points, not
# measured optima). The Kaggle sweep on YOLO11L sets them.
_target_: sn_gamestate.track.interpolation.LinearInterpolation
cfg:
  enabled: false
  n_dti: 25   # fill a gap only when 1 < dt < n_dti frames
  n_min: 5    # only tracklets with >= n_min real detections are interpolated
