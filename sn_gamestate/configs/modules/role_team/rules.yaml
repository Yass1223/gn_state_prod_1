# Role (player / goalkeeper / referee) and team SIDE (left / right) per FINAL
# trajectory. Runs AFTER traj_refine -- the whole point of the position: roles
# and sides are decided once, on complete trajectories with full temporal and
# positional evidence, and never gate the merge. "Appearance outlier" in this
# architecture MEANS "unclustered by team_embed"; there is no separate
# distance/DBSCAN outlier machinery here any more.
#
# Rules (sn_gamestate/team/role_team_api.py): assistants by the touchline
# geometry (one per side); goalkeepers by penalty-area depth (one per half, an
# unclustered near-equal-depth second candidate confirmed); the MAIN referee =
# among the remaining unclustered trajectories, those whose sampled y-range
# stays inside the symmetric 90% band of the trajectory means (rule 2.14:
# max(y_ref) <= band * max_i(mean_y_i) and min(y_ref) >= band * min_i(mean_y_i)),
# the candidate nearest the assistants; everyone else a player. Sides: the two
# team clusters are named by the cue chain over player mean-x (side_rule);
# an unclustered player takes its NEAREST centroid's side
# (team_cluster_nearest, a flagged fallback); a player with no embedding takes
# its mean-x half.
#
# Geometry thresholds carried over from the notebook's tuned operating point
# (tau_n/tau_a/tau_a_sy/tau_m/confirm/side_rule); band and gk_depth_m are this
# stage's own. UNTUNED on this pipeline's trajectories: sweep on valid later.
_target_: sn_gamestate.team.RoleTeamAssignment
cfg:
  pos_stride: 5
  audit_dir: ${project_dir}/audit/role_team
  params:
    tau_n: 5              # min sampled positions before any non-player role
    tau_a: 0.85           # assistant: |mean y| >= tau_a * clip max |mean y|
    tau_a_sy: 3.0         # assistant: max y std (m)
    tau_m: 0.30           # position margin that accepts a clustered candidate
    confirm: outlier      # outlier (= unclustered) | geometry
    side_rule: keeper     # keeper | vote (others fall back to vote)
    band: 0.9             # the symmetric 90% band of rule 2.14
    gk_depth_m: 4.0       # second-keeper confirmation depth window (m)
