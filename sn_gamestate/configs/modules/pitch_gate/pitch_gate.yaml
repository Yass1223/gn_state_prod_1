# Off-pitch tracklet gate on the mean projected position.
#
# Runs after `calibration` (needs bbox_pitch) and before `team_embed` (every
# later stage groups by track_id). Per final track_id, the mean of the projected
# bottom-middle points over the rows with a finite projection is compared with
# the 105 x 68 m pitch rectangle expanded by `margin_m`:
#   off-pitch iff |mean_x| > 52.5 + margin_m or |mean_y| > 34 + margin_m.
# With `enabled: true` the rows of an off-pitch tracklet lose their track_id (NaN:
# dropped by the evaluation export, ignored by team_embed / role_team / jersey /
# tracklet_agg / radar). With `enabled: false` track_id is untouched; the columns
# (track_id_pregate, pitch_gate_offpitch, pitch_mean_x, pitch_mean_y) and the
# sidecar are written either way, so the state has the same shape.
# No detection row is deleted. A tracklet with no finite projection is kept.
#
# margin_m is UNTUNED: 5 m is an assumption chosen to absorb projection error at
# the touchline and players a step outside it (throw-ins, retrieving a ball)
# while still gating the benches and the area behind the goals. Sweep it on the
# valid split before trusting it; the audit reports how many tracklets it gated
# and warns when the share is implausibly high (calibration problem).
_target_: sn_gamestate.pitch_gate.PitchGate
cfg:
  enabled: true
  margin_m: 5.0
  audit_dir: ${project_dir}/audit/pitch_gate
