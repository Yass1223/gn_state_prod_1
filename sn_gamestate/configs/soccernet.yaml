# SoccerNet Game State Reconstruction — clean pipeline.
#
# ONE entry config, ONE path through the pipeline. No alternative backends.
#
#   bbox_detector  YOLO11-L SoccerNet fine-tune (HF)          -> bbox_ltwh, bbox_conf
#   reid           prtreid (bpbreid/HRNet32, 256-d)           -> embeddings, role_detection
#   track          BoT-SORT · SOF + sports-OSNet (boxmot parity) -> track_id
#   gta_link       offline tracklet stitching (own OSNet)     -> track_id (merged)
#   interpolation  linear gap fill on final track ids (DTI)   -> synthesized rows (off)
#   calibration    BroadTrack (EVS, WACV'25) + image-to-pitch -> parameters, bbox_pitch
#   jersey_number  jn_pipeline_gsr (legibility -> DBNet++ -> PARSeq), multi-GPU
#   tracklet_agg   majority vote over [jersey_number, role]
#   team           k-means on prtreid embeddings
#   team_side      mean pitch position
#
# There is NO `pitch` stage: BroadTrack runs its own keypoint (NBJW) and line (TVCalib)
# detectors internally and emits camera parameters directly.
#
# First-time provisioning (both are Docker-free, Kaggle/Lightning friendly):
#   bash scripts/setup_broadtrack.sh      # C++ binary + LFS weights, built natively
#   bash scripts/setup_jn_gsr.sh          # python 3.10 venv + 3 checkpoints
# Verify the calibration conversion before trusting metrics:
#   python scripts/verify_broadtrack_conversion.py -c <calib.json> -f <frames dir>
# Run:
#   tracklab -cn soccernet
# Reference metrics (saved separately from the pipeline eval):
#   python scripts/reference_metrics.py --state states/sn-gamestate.pklz \
#       --dataset-path data/SoccerNetGS --eval-set test --out reference_metrics
hf_weights_repo: "Ynniss/sn-gamestate-weights"

defaults:
  - dataset: soccernet_gs
  - eval: gs_hota
  - engine: offline
  - visualization: gamestate
  - modules/bbox_detector: yolo_ultralytics_snft
  - modules/reid: prtreid
  - modules/track: botsort_osnet
  - modules/gta_link: gta_link
  - modules/interpolation: dti
  - modules/calibration: broadtrack
  - modules/jersey_number_detect: jn_gsr
  - modules/tracklet_agg: voting_role_jn
  - modules/team: kmeans_embeddings
  - modules/team_side: mean_position
  - _self_

# Pipeline definition. Order is load-bearing:
#   * gta_link right after track and BEFORE everything that depends on final track ids
#     (jersey recognition is tracklet-level; tracklet_agg and team vote per track_id);
#   * calibration before team_side (it consumes bbox_pitch).
pipeline:
  - bbox_detector
  - reid
  - track
  - gta_link
  - interpolation
  - calibration
  - jersey_number_detect
  - tracklet_agg
  - team
  - team_side

experiment_name: "sn-gamestate"

# Path definitions
home_dir: "${oc.env:HOME}"
data_dir: "${project_dir}/data"
model_dir: "${project_dir}/pretrained_models"

# TensorRT for the detector / tracker ReID / GTA-Link OSNet. Keep false for exact
# reproduction (FP16 engines are not bit-identical); build with scripts/build_trt_engines.py.
use_tensorrt: false
trt_dir: "${model_dir}/trt"

# Machine configuration
num_cores: 4
use_wandb: False
use_rich: True

modules: # module-specific batch sizes (override the per-module yaml values)
  bbox_detector: {batch_size: 4}
  reid: {batch_size: 64}
  track: {batch_size: 64}

# Flags
test_tracking: True
eval_tracking: True
print_config: False

# Dataset
dataset:
  nvid: 1  # -1 for the whole split; start at 1 to validate the setup.
  eval_set: "test"
  dataset_path: ${data_dir}/SoccerNetGS
  vids_dict:
    valid: []
    test: []   # e.g. ['SNGS-116'] to pin specific clips

# Tracker state. To iterate on a late stage only: set load_file to a saved .pklz and
# cut `pipeline:` down to the stages you still want to run.
state:
  save_file: "states/${experiment_name}.pklz"
  load_file: null

# Visualization
visualization:
  cfg:
    save_videos: True

project_dir: "${hydra:runtime.cwd}"
hydra:
  output_subdir: "configs"
  job:
    chdir: True
  run:
    dir: "outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"
  sweep:
    dir: "multirun_outputs/${experiment_name}/${now:%Y-%m-%d}/${now:%H-%M-%S}"
